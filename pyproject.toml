[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unreal-vibe-modding"
version = "0.1.0"
description = "Vibe modding for Unreal Engine games: run Lua live in a running game through UE4SS, from a CLI or an MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "glitchbunny0" }]
keywords = ["unreal-engine", "ue4ss", "modding", "mcp", "lua", "ai-agents"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
uvmod = "uvmod.cli:main"

[project.urls]
Homepage = "https://github.com/glitchbunny0/unreal-vibe-modding"

[tool.setuptools.packages.find]
include = ["uvmod*"]

[tool.setuptools.package-data]
uvmod = ["bridge/VibeBridge/*", "bridge/VibeBridge/Scripts/*"]
