[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unreal-vibe-modding"
version = "0.2.0"
description = "Vibe modding for Unreal Engine games and Cyberpunk 2077: run Lua live in a running game through UE4SS or Cyber Engine Tweaks, from a CLI or an MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "glitchbunny0" }]
keywords = ["unreal-engine", "ue4ss", "cyberpunk-2077", "cyber-engine-tweaks", "modding", "mcp", "lua", "ai-agents"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
uvmod = "uvmod.cli:main"

[project.urls]
Homepage = "https://github.com/glitchbunny0/unreal-vibe-modding"

[tool.setuptools.packages.find]
include = ["uvmod*"]

[tool.setuptools.package-data]
uvmod = ["bridge/VibeBridge/*", "bridge/VibeBridge/Scripts/*", "bridge/cet/VibeBridge/*", "lua/*.lua", "templates/mod/*", "templates/mod/tests/*",
         "templates/mod/{{NAME}}/*", "templates/mod/{{NAME}}/Scripts/*"]
